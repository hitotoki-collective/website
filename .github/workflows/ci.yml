name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The archive submodule stores ~4 GB of video in Git LFS. Nothing here may
  # smudge it: the checkout below writes pointers, then the project script
  # fetches only the stills. See docs/technical/requirements.md, Archive checkout.
  GIT_LFS_SKIP_SMUDGE: '1'
  CI: 'true'

jobs:
  verify:
    name: Check, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Submodules are checked out by scripts/checkout-content.sh, never here.
          submodules: false

      - name: Check out the content archive (stills only)
        run: scripts/checkout-content.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Cloudflare types
        run: pnpm run gen

      - name: Build
        run: pnpm run build

      - name: Type check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm vitest run --project server

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
